[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clef-ane"
version = "0.1.0"
description = "Run Clef-Flash text decisions on the Apple Neural Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11,<3",
    "transformers==5.10.2",
    "numpy>=2,<3",
    "safetensors>=0.6,<1",
    "huggingface-hub>=1,<3",
    "filelock>=3,<4",
]

[project.scripts]
clef-ane = "clef_ane.cli:main"

[tool.setuptools]
packages = ["clef_ane", "clef_ane.engine", "clef_ane._vendor"]
package-dir = {"clef_ane" = "src/clef_ane", "clef_ane.engine" = "scripts/ane", "clef_ane._vendor" = "src/clef_ane/_vendor"}

[tool.setuptools.package-data]
"clef_ane.engine" = ["ane_bridge.m"]
"clef_ane._vendor" = ["LICENSE", "SOURCE"]
